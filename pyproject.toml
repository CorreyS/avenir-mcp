# SPDX-FileCopyrightText: 2026 The avenir-mcp contributors
# SPDX-License-Identifier: MIT

[project]
name = "avenir-mcp"
dynamic = ["version"]
description = "Unofficial MCP server for YNAB: budgets, spending and transaction classification, built for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathieu Beal" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ynab",
    "you-need-a-budget",
    "budget",
    "budgeting",
    "personal-finance",
    "agents",
    "claude",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==4.1.1",
    "httpx>=0.28.1,<1",
    # Already required by fastmcp; declared because tool arguments, results and
    # journal entries are pydantic models, whose field docstrings become the
    # descriptions agents read.
    "pydantic>=2.13,<3",
    # Imported directly, though fastmcp brings them: declared so that a change in
    # fastmcp's own dependencies cannot remove them unnoticed. deptry checks it.
    "mcp>=2.2.0,<3",
    "mcp-types>=2.2.0,<3",
    "starlette>=1.7.0,<2",
    # py-key-value-aio (brought by fastmcp) needs beartype, whose 0.22 does not import on
    # Python 3.15 (typing no longer has no_type_check_decorator). Required here until
    # py-key-value-aio asks for 0.23.
    "beartype>=0.23; python_version >= '3.15'",
]

[project.urls]
Homepage = "https://github.com/mathbeal/avenir-mcp"
Documentation = "https://avenir-mcp.pages.dev/avenir-mcp/"
Repository = "https://github.com/mathbeal/avenir-mcp"
Issues = "https://github.com/mathbeal/avenir-mcp/issues"
Changelog = "https://github.com/mathbeal/avenir-mcp/blob/main/CHANGELOG.md"

[project.scripts]
avenir-mcp = "avenir_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "pylint==4.1.3",
    "ruff==0.17.0",
    "deptry==0.25.1",
    "hypothesis==6.169.3",
    "mutmut==3.8.0",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
    "pytest-benchmark==5.3.0",
    "vulture==2.16",
]

# hatchling builds the same wheel and sdist twice from the same commit: files in a fixed
# order, every date set to SOURCE_DATE_EPOCH, no user or group name, and the same gzip
# header. Pinned, so that a release can be rebuilt with the backend that built it.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "avenir_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["avenir_mcp"]

# The package and its tests, as before; the documentation, evaluations and tooling stay
# in the repository.
[tool.hatch.build.targets.sdist]
include = ["/avenir_mcp", "/tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["avenir_mcp", "tests", "evals", "docsgen", "benchmarks", "mcpb/src"]

# Docstrings in Google style, complete: every argument, return value and exception.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# C901: cyclomatic complexity. D, DOC: Google docstrings. I: sorted imports. S: bandit's
# security checks.
select = ["C901", "D", "DOC", "I", "S"]
# A Raises section may name what a called function raises: the caller needs it too.
ignore = ["DOC502"]
# The DOC rules (pydoclint) are still in preview.
preview = true

[tool.ruff.lint.per-file-ignores]
# Every function has a docstring, tests included: a test says the behaviour it checks.
# Args/Returns/Raises sections are required in the package only. Tests assert, and use
# made-up tokens.
"tests/**" = ["DOC", "S101", "S105", "S106"]
"evals/**" = ["DOC"]
"docsgen/**" = ["DOC"]
# Benchmarks assert what they timed, on a seeded (not cryptographic) random plan.
"benchmarks/**" = ["DOC", "S101", "S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Complexity (`just lint`, CI): a ratchet, not a target. 19 is the highest any function
# reaches today, `Handler._route` in `evals/fake_ynab.py`, so nothing may go above the worst
# that already exists. The number only ever moves down: splitting `_route` brings it to 12,
# which is `savings.summary`, the worst of the package. No `noqa` and no per-file ignore to
# go over it: ruff has no per-file ceiling, so an exception would switch the rule off for a
# whole file instead of raising its limit.
# This is not radon's count, which reads 44 for the same `_route` and 40 for the same
# `savings.summary`: ruff's mccabe leaves out boolean operators, conditional expressions and
# comprehensions. `just complexity` reports radon's; this setting gates ruff's.
[tool.ruff.lint.mccabe]
max-complexity = 19

# Run with `uvx` (just lint, CI), not installed: pydoclint needs a fork of docstring_parser
# that takes the place of the one fastmcp needs.
# What ruff's DOC rules do not check yet: arguments in the signature's order, no type in
# a docstring (the annotation is the only one), and a summary-only docstring checked too.
# Raises stay with ruff (DOC502 is ignored on purpose); model fields are checked through
# the tools' schemas (tests/test_protocol.py).
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-raises = true
check-class-attributes = false
allow-init-docstring = true
skip-checking-short-docstrings = false

[tool.pylint.format]
max-line-length = 100

# A suppression that silences nothing hides the next real finding at that line: refused.
[tool.pylint."messages control"]
enable = ["useless-suppression"]

[tool.pylint.main]
fail-on = ["useless-suppression"]

# Duplication (`just lint`, CI): pylint's `duplicate-code` compares every file of one run
# with the others, so the directories `just lint` passes it are the ones it covers. Four
# lines is pylint's own default, written down here because a check that depends on a
# default can loosen without a commit saying so. Comments, docstrings, imports and
# signatures are left out of the comparison, so four means four lines that compute.
[tool.pylint.similarities]
min-similarity-lines = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Python 3.15 warns about a protocol of py-key-value (brought by fastmcp) checked
    # without @runtime_checkable, and beartype then declines to check that library.
    # Neither concerns avenir-mcp's code; to remove once py-key-value marks it.
    "ignore:.*isn't explicitly decorated with @runtime_checkable:DeprecationWarning",
    "ignore:Method key_value\\..*:beartype.roar.BeartypeClawDecorWarning",
]
xfail_strict = true
markers = [
    "ynab_terms: a rule of YNAB's API terms that the self-checked badge promises",
]
addopts = "--strict-markers --strict-config --cov=avenir_mcp --cov-branch --cov-report=term-missing --cov-fail-under=100"

# docsgen is a development tool, not in the package (only avenir_mcp ships): it may use
# the development dependency pyyaml, to read YNAB's specification. The benchmarks, likewise,
# use pytest-benchmark.
[tool.deptry.per_rule_ignores]
DEP002 = ["beartype"]
DEP004 = ["yaml", "pytest_benchmark"]

# Dead code (`just lint`, CI): the same directories ruff reads, plus the whitelist, which
# vulture reads as code so that a name in it counts as read. No min-confidence: vulture
# reports everything it finds, and `vulture_whitelist.py` says why each name it cannot see
# is alive. A lower threshold would hide a finding; a higher one would hide them all and
# leave the whitelist empty.
# A function registered by one of these decorators is called by FastMCP or pytest, never
# by a line of the repository. The decorator is the proof it is alive, so ignoring them
# hides nothing a per-name entry would show, and adding a tool or a fixture needs no edit
# to the whitelist.
[tool.vulture]
paths = ["avenir_mcp", "tests", "evals", "docsgen", "benchmarks", "vulture_whitelist.py"]
ignore_decorators = ["@mcp.tool", "@mcp.resource", "@mcp.prompt", "@pytest.fixture"]

# Mutation testing (`just mutate`): the modules that compute, against the tests that cover
# them. What is left out mutates nothing: the client, the transport, the journal and the
# tool wrappers are checked by their own tests, not by changing them at random. `retry.py`
# only decides, from a method and a failure, what may be sent again: it mutates like any
# other module that computes, and a change there could duplicate a write.
[tool.mutmut]
source_paths = ["avenir_mcp/"]
do_not_mutate = [
    "avenir_mcp/__init__.py",
    "avenir_mcp/__main__.py",
    "avenir_mcp/amounts.py",
    "avenir_mcp/app.py",
    "avenir_mcp/client.py",
    "avenir_mcp/confirm.py",
    "avenir_mcp/context.py",
    "avenir_mcp/http_auth.py",
    "avenir_mcp/journal.py",
    "avenir_mcp/logs.py",
    "avenir_mcp/model.py",
    "avenir_mcp/server.py",
    "avenir_mcp/tools_*.py",
]
also_copy = ["evals/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
# Only these tests run against a mutant, so every module above has to be covered by one
# of them: a module no file here reaches comes back "no tests", which measures nothing.
# Most are the module's own tests; the three `test_protocol_*` files are there because
# they are the only tests of a branch: a budget with no credit card, a month outside the
# history asked for, and a payee name holding a NUL.
pytest_add_cli_args_test_selection = [
    "tests/test_age.py",
    "tests/test_analytics.py",
    "tests/test_charges.py",
    "tests/test_classifier.py",
    "tests/test_flags.py",
    "tests/test_forecast.py",
    "tests/test_networth.py",
    "tests/test_payees.py",
    "tests/test_payoff.py",
    "tests/test_properties.py",
    "tests/test_protocol_create.py",
    "tests/test_protocol_runway.py",
    "tests/test_protocol_savings.py",
    "tests/test_reconcile.py",
    "tests/test_retry.py",
    "tests/test_runway.py",
    "tests/test_savings.py",
    "tests/test_schedule.py",
    "tests/test_search.py",
    "tests/test_split.py",
    "tests/test_targets.py",
    "tests/test_text.py",
    "tests/test_triage.py",
    "tests/test_underfunded.py",
    "tests/test_updates.py",
    "tests/test_writes.py",
]

[tool.coverage.run]
omit = ["avenir_mcp/__main__.py"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
