<title id="title">One write in avenir-mcp: previewed, confirmed, then undone</title>
<desc id="desc">Restaurants is over budget. Move 30 from Tennis to cover it. Move 30.00 from Tennis to Restaurants for this month? - Tennis: 80.00 → 50.00 - Restaurants: 120.00 → 150.00 (available -22.50 → +7.50) Yes, go ahead. Moved. undo_operation with operation_id &lt;operation id&gt; moves it back. Actually, put it back. Undo: move 30.00 back from Restaurants to Tennis for this month? Both amounts restored.</desc>
