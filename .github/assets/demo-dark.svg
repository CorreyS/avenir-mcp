<text x="28" y="468.0" font-size="11" fill="#c3c2b7">Every answer above is what avenir-mcp returns on the invented demo plan today, replayed by python -m docsgen.</text>
<text x="28" y="484.0" font-size="11" fill="#c3c2b7">“this month” stands for the month’s name, &lt;operation id&gt; for the journal id.</text>
