name: quality

# On a pull request, and on main once merged; a push to a pull request's branch
# alone would run everything a second time.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A new push to a pull request makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  lock:
    name: lockfile is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv lock --check
      # The Claude Code plugin's own lock: the server it starts refuses to run (`--locked`)
      # when it no longer matches the release the plugin pins.
      - run: uv lock --check --project plugin

  plugin:
    name: the Claude Code plugin is submittable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
      # The checks the plugin directory runs before it accepts a submission, on a fresh
      # checkout so that only what is committed is read. `--strict` fails on a warning
      # too: a missing icon or privacy policy would be a warning on the submission.
      - run: npx --yes @anthropic-ai/claude-code@2.1.308 plugin validate --profile directory --strict ./plugin

  lint:
    name: ruff, pylint, pydoclint, vulture, deptry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv run ruff format --check avenir_mcp tests evals docsgen benchmarks mcpb/src
      - run: uv run pylint avenir_mcp tests evals docsgen benchmarks mcpb/src
      - run: uv run ruff check avenir_mcp tests evals docsgen benchmarks mcpb/src
      - run: uvx pydoclint==0.10.1 avenir_mcp
      # Dead code. Its paths and its whitelist are in pyproject.toml.
      - run: uv run vulture
      - run: uv run deptry .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv run mypy
      # Each benchmark once, untimed: they keep working without slowing CI down.
      - run: uv run pytest benchmarks -o addopts="" -p no:cacheprovider --benchmark-disable

  tests:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # avenir-mcp runs on its users' machines: Linux and macOS are required.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        # A macOS runner costs ten Linux ones: a pull request tries the newest Python
        # there; main tries them all.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
            python-version: "3.12"
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
            python-version: "3.13"
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
            python-version: "3.14"
        include:
          # Windows is required too. POSIX-only checks (file permissions) are
          # skipped there, so coverage is enforced on Linux and macOS only.
          - os: windows-latest
            python-version: "3.14"
            experimental: false
            coverage: "--cov-fail-under=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The suite never calls YNAB: no token is needed, and none is available here.
      - id: pytest
        run: uv run pytest ${{ matrix.coverage }}
        continue-on-error: ${{ matrix.experimental }}
      - if: steps.pytest.outcome == 'failure'
        env:
          PYTHON: ${{ matrix.python-version }}
        run: echo "::warning::The tests fail on Python $PYTHON, which is still experimental."

  vocabulary:
    name: lexdrift against its baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # A new verb for an idea already named fails; accepted drift lives in lexdrift.lock.
      - run: uvx lexdrift check avenir_mcp --baseline lexdrift.lock

  hygiene:
    name: typos, workflow audit, licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx typos .
      - run: uvx zizmor --persona=regular .github/workflows/
      # Every file states its copyright and licence, in its first lines or in REUSE.toml.
      - run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  audit:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
      # The server holds a token with write access to people's budgets: a
      # vulnerable dependency is a vulnerable budget.
      - run: uv export --frozen --no-emit-project --all-groups -o requirements.txt
      - run: uvx pip-audit --strict --disable-pip -r requirements.txt
      # The Claude Code plugin's own lock, which the audit above never reads.
      - run: uv export --frozen --no-emit-project --project plugin -o plugin-requirements.txt
      - run: uvx pip-audit --strict --disable-pip -r plugin-requirements.txt
      # The documentation site's own lock, which the audit above never reads.
      - run: npm audit --prefix docs --package-lock-only --audit-level=high

  secrets:
    name: no secret in the history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the last one: a secret removed later is still published.
          fetch-depth: 0
      # gitleaks 8.30.1, pinned by digest. --redact keeps a found secret out of the log.
      - run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --log-opts=--all

  bundle:
    name: the Claude Desktop extension packs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The readers the extension is for are mostly on Windows, where nobody develops
        # avenir-mcp: the packer runs there too, since what it makes of a path separator
        # is only known by running it. That the launcher starts there is the pytest
        # job's business: the suite runs on Windows and starts it.
        os: [ubuntu-latest, windows-latest]
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    defaults:
      run:
        # One command for both runners: PowerShell would not read $RUNNER_TEMP.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
      # The manifest against the MCPB schema, then the zip Claude Desktop installs. The
      # same pinned packer as `just bundle` and the release: one verdict on one manifest.
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb "$RUNNER_TEMP/avenir-mcp.mcpb"

  docker:
    name: the container starts and lists its tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # The image Docker's MCP catalogue builds from this repository, built the same way
      # here, on the runner's own Docker: nothing is pushed and nothing is published.
      - run: docker build -t avenir-mcp:ci .
      # Then the handshake the catalogue makes to list the tools: a container started
      # with no token at all answers `initialize` and `tools/list`, read-only.
      - env:
          AVENIR_MCP_DOCKER_IMAGE: avenir-mcp:ci
        run: uv run pytest tests/test_docker.py -o addopts="" -p no:cacheprovider

  reproducible:
    name: the build is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Anyone can rebuild a release and compare it with PyPI's files: two builds of the
      # same commit, the second with every source file touched, give the same bytes.
      - name: build twice and compare
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --quiet -o "$RUNNER_TEMP/first"
          find avenir_mcp tests -type f -exec touch {} +
          uv build --quiet -o "$RUNNER_TEMP/second"
          (cd "$RUNNER_TEMP/first" && sha256sum -- *) | tee "$RUNNER_TEMP/first.sha256"
          (cd "$RUNNER_TEMP/second" && sha256sum --check --strict -- ../first.sha256)

  passed:
    name: CI passed
    # The one check branch protection requires: it stands for every job above.
    if: always()
    needs:
      [lock, plugin, lint, types, tests, vocabulary, hygiene, audit, secrets, bundle,
       docker, reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
