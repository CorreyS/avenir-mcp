name: MCP Inspector

# The server as a client sees it, through the official MCP Inspector, on the demo
# budget. A workflow of its own, so that its badge shows this check alone.
# On a pull request, and on main once merged; a push to a pull request's branch
# alone would run everything a second time.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  inspector:
    name: MCP Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
      # Lists, schema portability (--strict) and one call of each kind, on the demo budget.
      - run: uv run python -m evals.inspector
