name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: build the site in every language
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # Known vulnerabilities in the site's dependencies, which build every page it serves.
      # Fails on any advisory except those reviewed and named in scripts/audit.mjs.
      - run: npm run audit
        working-directory: docs
      # The build's own code: the plugin that sets the name avenir-mcp apart.
      - run: npm test
        working-directory: docs
      # Starlight in every language; a broken internal link fails the build.
      - run: npm run build
        working-directory: docs
      # What Cloudflare Pages builds and serves: the site under /avenir-mcp/ with its
      # _headers and _redirects. Fails if a security header is missing or weakened.
      - run: npm run build:cloudflare
        working-directory: docs
      # What GitHub Pages publishes: no site, only a redirect from each page's old address
      # to the same page on Cloudflare Pages, and a 404 page that does the same for the rest.
      - run: npm run build:redirects
        working-directory: docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/redirect-dist

  deploy:
    name: publish the redirects on GitHub Pages
    # Pages needs a public repository on the free plan: publish once it is public.
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
