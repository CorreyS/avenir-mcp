name: publish

on:
  release:
    types: [published]

permissions: {}

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    # Reading the code is all this job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: the tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          found="$(uv run --no-project python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("avenir_mcp/__init__.py").read_text()).group(1))')"
          echo "tag=$expected  version=$found"
          test "$expected" = "$found"

      # Every date inside the files is the tagged commit's: anyone can rebuild them from
      # the tag and get the same bytes (SECURITY.md, "Rebuilding a release"). A second
      # build checks it before anything is uploaded.
      - name: build, twice, from the tagged commit
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          uv build -o dist
          uv build --quiet -o "$RUNNER_TEMP/again"
          (cd dist && sha256sum -- *) | tee "$RUNNER_TEMP/dist.sha256"
          (cd "$RUNNER_TEMP/again" && sha256sum --check --strict -- "$RUNNER_TEMP/dist.sha256")
      - run: uv run --no-project --with twine twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avenir-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  bundle:
    name: pack the Claude Desktop extension
    # The .mcpb a reader opens for a one-click install. It installs avenir-mcp from PyPI,
    # so it is attached once the release is there: `needs: publish`.
    needs: publish
    runs-on: ubuntu-latest
    # The packer's version is pinned, its own dependencies are not. It therefore runs with
    # nothing it could write to: the packed file crosses to `bundle-upload`, which is the
    # only job holding a token that can change the release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a release job writing a cache could poison a later run (zizmor).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          package-manager-cache: false

      - name: the tag must match the version the extension installs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          found="$(node -p 'require("./mcpb/manifest.json").version')"
          echo "tag=$expected  manifest=$found"
          test "$expected" = "$found"

      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb
      # One name for every release, so the `releases/latest/download/avenir-mcp.mcpb` link
      # the documentation gives always downloads the newest extension. Which version it
      # installs is read from its manifest.
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb avenir-mcp.mcpb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          path: "*.mcpb"
          if-no-files-found: error

  bundle-upload:
    name: attach the Claude Desktop extension to the release
    # The only job that can write to the release, and it runs no third-party code: no Node,
    # no npx, nothing but the file `bundle` packed and the tag it was packed for.
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
      - run: gh release upload "$TAG" avenir-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  sbom:
    name: attach the SBOM to the release
    # What avenir-mcp runs with, exactly as locked: a CycloneDX bill of materials, for
    # users who audit their dependencies.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv export --no-dev --format cyclonedx1.5 -o avenir-mcp.cdx.json
      - run: gh release upload "$TAG" avenir-mcp.cdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
