<desc id="desc">Restaurants looks tight. How is the month going, and where is the room? Looking at the month, every category, budget against spending and the last three months… Restaurants is the only category over budget this month. 166.50 spent of 144.00 (120.00 budgeted + 24.00 carried over), 138.8 %, available −22.50. Cover it from Tennis. Move 22.50 from Tennis to Restaurants for this month?</desc>
