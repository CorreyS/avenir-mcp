[files]
# Agent replies archived by the evaluation, cut to their last characters: quoted
# as produced, not text to correct.
extend-exclude = [
  "evals/results/",
  # Translated pages: typos knows English only.
  "docs/src/content/docs/fr/",
  "docs/src/content/docs/es/",
  "docs/src/content/docs/de/",
  "docs/src/content/docs/nl/",
  # Examples captured on the demo budget named in those languages.
  "docs/src/snippets/fr/",
  "docs/src/snippets/es/",
  "docs/src/snippets/de/",
  "docs/src/snippets/nl/",
  # Labels and titles of the generated pages, in every language.
  "docsgen/guide_titles.json",
  "docsgen/labels.json",
  "docs/src/components/home-i18n.ts",
  "docs/src/components/BudgetChart.astro",
  "docs/package-lock.json",
]

[default.extend-words]
# Sidebar labels translated in docs/astro.config.mjs.
Conceptos = "Conceptos"
Projet = "Projet"
Referenz = "Referenz"
Naslag = "Naslag"
# The demo budget's names in French and Spanish (evals/demo_budget.py).
Projets = "Projets"
Restaurantes = "Restaurantes"
# What a documented call types in Dutch (docsgen/examples.py): "in cash".
contant = "contant"
# The PyPI distribution that carries the CA bundle, named in a commit message and so
# in CHANGELOG.md. typos skips lock files, where it appears otherwise, but not prose.
certifi = "certifi"
